<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Result System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🎓 Student Result Calculator</h1>

    <input type="number" id="m1" placeholder="Subject 1 Marks">
    <input type="number" id="m2" placeholder="Subject 2 Marks">
    <input type="number" id="m3" placeholder="Subject 3 Marks">
    <input type="number" id="m4" placeholder="Subject 4 Marks">
    <input type="number" id="m5" placeholder="Subject 5 Marks">

    <button onclick="calculateResult()">Calculate Result</button>
    <button class="reset" onclick="resetForm()">Reset</button>

    <div id="resultBox" class="result-box">
        <h2 id="total"></h2>
        <h2 id="percentage"></h2>
        <h2 id="grade"></h2>

        <div class="progress">
            <div id="bar"></div>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
