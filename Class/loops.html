<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOOPS</title>
</head>
<body>
    <script>
        //loops for repetative conditions

        //for loops...

        let studentlist=["vivek","vinay","rahul","abhi","sanjay"];
        for(let i=0;i<studentlist.length;i++){
            console.log(studentlist[i]);
        }

        //while loop

        let i=0;
        while(i<studentlist.length){
            // console.log(studentlist[i])
                i++;
            
        }

        //for  of loop

        for(let x of studentlist){
            console.log(x);
        }

        //for in loop

        for(let y in studentlist){
            console.log(y);
        }

    </script>
    
</body>
</html>
